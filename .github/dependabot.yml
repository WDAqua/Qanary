# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
  # Maven reactor (root pom + modules). Replaces the ad-hoc Snyk security PRs.
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # virt_jena_v5_3 calls ModelUtils.tripleToStatement, which Jena 6 removed
      - dependency-name: "org.apache.jena:*"
        update-types: ["version-update:semver-major"]
  # Pipeline Docker base image (debian/openjdk).
  - package-ecosystem: "docker"
    directory: "/qanary_pipeline-template"
    schedule:
      interval: "weekly"
